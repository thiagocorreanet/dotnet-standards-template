# Modo lite: PostgreSQL, Keycloak e API. Para o modo completo, acrescente -f compose.observability.yaml.
name: ${COMPOSE_PROJECT_NAME:-modular-api-local}
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute node scripts/init-local.mjs}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:?}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-local.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [backend]
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/identity_provider
      KC_DB_USERNAME: identity_owner
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HOSTNAME: http://identity.localhost:8080
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./.local/realm-local.json:/opt/keycloak/data/import/realm.json:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      backend:
        aliases: [identity.localhost]
  migrate:
    build:
      context: ./api
      dockerfile: src/hosts/Host.Api/Dockerfile
      # Só usados no projeto gerado, para baixar os pacotes ModularApi.* do feed privado; ausentes, o build segue sem eles.
      secrets: [modularapi_feed_user, modularapi_feed_token]
    image: ${COMPOSE_PROJECT_NAME:-modular-api-local}:local
    command: ["migrate"]
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: Development
      Oidc__Authority: http://identity.localhost:8080/realms/modular-api
      Oidc__Audience: modular-api
      Oidc__RequireHttpsMetadata: "false"
      Database__MigrateOnStartup: "false"
      Database__RuntimeRole: api_runtime
      AllowedHosts: "localhost;127.0.0.1;api"
    secrets:
      - source: migrator-db
        target: ConnectionStrings__Database
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
  bootstrap:
    image: ${COMPOSE_PROJECT_NAME:-modular-api-local}:local
    profiles: [setup]
    command: ["bootstrap-identity"]
    environment:
      <<: *api-environment
      Bootstrap__Subject: ${DEV_ADMIN_SUBJECT:?}
      Bootstrap__Name: Development Account
      Bootstrap__Email: developer@example.test
    secrets:
      - source: runtime-db
        target: ConnectionStrings__Database
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend]
  api:
    image: ${COMPOSE_PROJECT_NAME:-modular-api-local}:local
    environment:
      <<: *api-environment
      # Modo lite: endpoint vazio desliga a exportação OTLP; logs seguem no console. O modo completo usa compose.observability.yaml.
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      Observability__TraceSampleRatio: "1.0"
      Cors__AllowedOrigins__0: http://localhost:5173
    ports: ["127.0.0.1:5761:8080"]
    secrets:
      - source: runtime-db
        target: ConnectionStrings__Database
    depends_on:
      migrate: { condition: service_completed_successfully }
      keycloak: { condition: service_started }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    networks: [backend]
networks:
  backend: {}
volumes:
  postgres-data: {}
secrets:
  modularapi_feed_user: { environment: MODULARAPI_FEED_USER }
  modularapi_feed_token: { environment: MODULARAPI_FEED_TOKEN }
  runtime-db: { file: ./.local/runtime-db }
  migrator-db: { file: ./.local/migrator-db }
