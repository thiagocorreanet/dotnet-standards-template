name: ${COMPOSE_PROJECT_NAME:-modular-api-local}
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute node scripts/init-local.mjs}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:?}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-local.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [backend]
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/identity_provider
      KC_DB_USERNAME: identity_owner
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HOSTNAME: http://identity.localhost:8080
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./.local/realm-local.json:/opt/keycloak/data/import/realm.json:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      backend:
        aliases: [identity.localhost]
  migrate:
    build: { context: ./api, dockerfile: src/hosts/Host.Api/Dockerfile }
    image: ${COMPOSE_PROJECT_NAME:-modular-api-local}:local
    command: ["migrate"]
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: Development
      Oidc__Authority: http://identity.localhost:8080/realms/modular-api
      Oidc__Audience: modular-api
      Oidc__RequireHttpsMetadata: "false"
      Database__MigrateOnStartup: "false"
      Database__RuntimeRole: api_runtime
      AllowedHosts: "localhost;127.0.0.1;api"
    secrets:
      - source: migrator-db
        target: ConnectionStrings__ModularApi
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
  bootstrap:
    image: ${COMPOSE_PROJECT_NAME:-modular-api-local}:local
    profiles: [setup]
    command: ["bootstrap-identity"]
    environment:
      <<: *api-environment
      Bootstrap__Subject: ${DEV_ADMIN_SUBJECT:?}
      Bootstrap__Name: Development Account
      Bootstrap__Email: developer@example.test
    secrets:
      - source: runtime-db
        target: ConnectionStrings__ModularApi
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend]
  api:
    image: ${COMPOSE_PROJECT_NAME:-modular-api-local}:local
    environment:
      <<: *api-environment
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      Observability__TraceSampleRatio: "1.0"
      Cors__AllowedOrigins__0: http://localhost:5173
    ports: ["127.0.0.1:5761:8080"]
    secrets:
      - source: runtime-db
        target: ConnectionStrings__ModularApi
    depends_on:
      migrate: { condition: service_completed_successfully }
      keycloak: { condition: service_started }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    networks: [backend]
  collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    profiles: [observability]
    command: ["--config=/etc/collector.yaml"]
    volumes:
      - ./infra/observability/collector.yaml:/etc/collector.yaml:ro
      - collector-data:/var/lib/otelcol
    ports: ["127.0.0.1:4317:4317"]
    user: "10001:10001"
    depends_on:
      telemetry-init: { condition: service_completed_successfully }
      tempo: { condition: service_started }
      loki: { condition: service_started }
    networks: [backend]
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [backend]
  tempo:
    image: grafana/tempo:3.0.3
    profiles: [observability]
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    depends_on:
      telemetry-init: { condition: service_completed_successfully }
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [backend]
  loki:
    image: grafana/loki:3.7.8
    profiles: [observability]
    command: ["-config.file=/etc/loki/config.yaml"]
    depends_on:
      telemetry-init: { condition: service_completed_successfully }
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks: [backend]
  grafana:
    image: grafana/grafana:13.2.2
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: operator
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    secrets: [grafana-password]
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [backend]
  telemetry-init:
    image: alpine:3.22
    profiles: [observability]
    command: ["sh", "-ec", "chown 10001:10001 /collector /tempo /loki"]
    volumes: ["collector-data:/collector", "tempo-data:/tempo", "loki-data:/loki"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]
networks:
  backend: {}
volumes:
  postgres-data: {}
  collector-data: {}
  prometheus-data: {}
  tempo-data: {}
  loki-data: {}
  grafana-data: {}
secrets:
  runtime-db: { file: ./.local/runtime-db }
  migrator-db: { file: ./.local/migrator-db }
  grafana-password: { file: ./.local/grafana-password }
