# Modo completo: acrescenta Collector, Prometheus, Tempo, Loki e Grafana ao modo lite.
# Uso: docker compose -f compose.local.yaml -f compose.observability.yaml up --build -d
services:
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
    depends_on:
      collector: { condition: service_started }
  collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/collector.yaml"]
    volumes:
      - ./infra/observability/collector.yaml:/etc/collector.yaml:ro
      - collector-data:/var/lib/otelcol
    ports: ["127.0.0.1:4317:4317"]
    user: "10001:10001"
    depends_on:
      telemetry-init: { condition: service_completed_successfully }
      tempo: { condition: service_started }
      loki: { condition: service_started }
    networks: [backend]
  prometheus:
    image: prom/prometheus:v3.14.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [backend]
  tempo:
    image: grafana/tempo:3.0.3
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    depends_on:
      telemetry-init: { condition: service_completed_successfully }
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [backend]
  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    depends_on:
      telemetry-init: { condition: service_completed_successfully }
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks: [backend]
  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: operator
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    secrets: [grafana-password]
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [backend]
  telemetry-init:
    image: alpine:3.22
    command: ["sh", "-ec", "chown 10001:10001 /collector /tempo /loki"]
    volumes: ["collector-data:/collector", "tempo-data:/tempo", "loki-data:/loki"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]
volumes:
  collector-data: {}
  prometheus-data: {}
  tempo-data: {}
  loki-data: {}
  grafana-data: {}
secrets:
  grafana-password: { file: ./.local/grafana-password }
