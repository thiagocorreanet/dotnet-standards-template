name: operational-release-checks
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  schedule:
    - cron: '20 6 * * 1'
permissions:
  contents: read
concurrency:
  group: operational-${{ github.ref }}
  cancel-in-progress: false
jobs:
  local-production-like:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - run: node scripts/init-local.mjs
      - run: docker compose -f compose.local.yaml --profile observability up -d --build
      - run: node scripts/bootstrap-local.mjs
      - run: node scripts/wait-local.mjs
      - run: node scripts/smoke-observability.mjs
      - run: node scripts/smoke-production-host.mjs
      - run: node scripts/restore-drill.mjs
      - name: Stop only this job's stack (preserve volumes)
        if: always()
        run: docker compose -f compose.local.yaml --profile observability down
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: restore-manifests-only
          path: artifacts/backups/**/manifest.json
          retention-days: 14
# Não publicar dumps, .env, secrets ou logs integrais do provedor.
# Ensaio local automatizado não certifica MFA/HA, backup externo ou RPO/RTO produtivos.
