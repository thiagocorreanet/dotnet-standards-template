target: all
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: "0.0.0.0:4317" }
        http: { endpoint: "0.0.0.0:4318" }
storage:
  trace:
    backend: local
    wal: { path: /var/tempo/wal }
    local: { path: /var/tempo/blocks }
backend_worker:
  compaction:
    block_retention: 168h
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 168h
usage_report:
  reporting_enabled: false
