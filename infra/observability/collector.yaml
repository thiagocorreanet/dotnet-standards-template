extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol/storage
    create_directory: true
receivers:
  otlp:
    protocols:
      grpc: { endpoint: "0.0.0.0:4317" }
      http: { endpoint: "0.0.0.0:4318" }
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  transform/privacy:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "db.statement")
          - delete_key(attributes, "db.query.text")
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "url.full")
          - delete_key(attributes, "client.address")
          - delete_key(attributes, "user_agent.original")
      - context: spanevent
        statements:
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
    log_statements:
      - context: log
        statements:
          - delete_key(attributes, "RequestPath")
          - delete_key(attributes, "ClientIp")
          - delete_key(attributes, "UserAgent")
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
  batch:
    timeout: 5s
    send_batch_size: 512
exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion: { enabled: true }
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
    sending_queue: { storage: file_storage, queue_size: 10000 }
    retry_on_failure: { enabled: true, max_elapsed_time: 300s }
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    sending_queue: { storage: file_storage, queue_size: 10000 }
    retry_on_failure: { enabled: true, max_elapsed_time: 300s }
service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus: { host: 0.0.0.0, port: 8888 }
  extensions: [health_check, file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlphttp/loki]
